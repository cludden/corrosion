# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com

# The lines below are called `modelines`. See `:help modeline`
# Feel free to remove those if you don't want/need to use them.
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

project_name: corrosion

before:
  hooks:
    # if you don't do these things before calling goreleaser, it might be a
    # good idea to do them here:
    - rustup default nightly-2023-12-03
    - cargo install --locked cargo-zigbuild
    - cargo fetch --locked

builds:
  - builder: rust
    flags:
      - --release 
      - --package=file:///Users/cludden/workspaces/cludden/corrosion/crates/corrosion
    targets:
      - x86_64-unknown-linux-gnu
      # - x86_64-apple-darwin
      # - x86_64-pc-windows-gnu
      - aarch64-unknown-linux-gnu
      - aarch64-apple-darwin

archives:
  - formats: [tar.gz]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: [zip]

release:
  github:
    owner: cludden
    name: corrosion
  replace_existing_artifacts: true

dockers:
  - use: buildx
    dockerfile: Dockerfile
    image_templates:
      - "cludden/corrosion:{{ .Version }}"
      - "cludden/corrosion:latest"
    skip_push: false
    build_flag_templates:
      - --platform=linux/amd64,linux/arm64
  
    extra_files:
      - dist/corrosion_aarch64-unknown-linux-gnu/corrosion
      - dist/corrosion_x86_64-unknown-linux-gnu/corrosion
      - entrypoint.sh

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

